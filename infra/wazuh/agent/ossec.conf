<ossec_config>
  <client>
    <server><address>wazuh.manager</address><port>1514</port><protocol>tcp</protocol></server>
    <enrollment><enabled>yes</enabled><manager_address>wazuh.manager</manager_address><port>1515</port><agent_name>haedam-s7-agent</agent_name><authorization_pass_path>etc/authd.pass</authorization_pass_path></enrollment>
    <notify_time>10</notify_time><time-reconnect>30</time-reconnect><auto_restart>yes</auto_restart>
  </client>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <syscheck>
    <disabled>no</disabled><frequency>60</frequency><scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes" report_changes="no">/var/www/haedam</directories>
    <directories realtime="yes" check_all="yes" report_changes="no">/var/lib/haedam/backend</directories>
  </syscheck>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/haedam-portal/events.jsonl</location>
    <only-future-events>yes</only-future-events>
  </localfile>
  <active-response><disabled>no</disabled></active-response>
</ossec_config>
