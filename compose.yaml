name: haedam-portfolio

services:
  db:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: haedam
      MYSQL_USER: haedam
    volumes:
      - portal-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  portal:
    init: true
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://haedam:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db/haedam?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORTAL_PORT:-15000}:5000"
    volumes:
      - portal-instance:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/v1/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  portal-db:
  portal-instance:
